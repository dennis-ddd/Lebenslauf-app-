<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16141C">
<meta name="description" content="Lebe ein ganzes Leben in einer zufälligen Stadt: Schule, Job, Liebe, Börse und Social Media.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lebenslauf">
<title>Lebenslauf – Lebenssimulator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800;900&display=swap">
<style>@@CSS@@</style>
</head>
<body>
<div id="app"></div>
<div id="modal" role="dialog" aria-modal="true"><div class="dlg" id="dlg"></div></div>
<div id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>@@JS@@</script>
<script>
(function(){const inFrame=window.top!==window;let done=false;let opt={};try{opt=JSON.parse(localStorage.getItem('lebenslauf-opts')||'{}')}catch(e){}
  const fs=()=>{if(done||inFrame||opt.fs===false||document.fullscreenElement||!document.documentElement.requestFullscreen)return;
  if(matchMedia('(display-mode: fullscreen)').matches){done=true;return}done=true;document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(()=>{})};
  document.addEventListener('pointerup',fs);})();
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update()});
    }).catch(()=>{});
  });
}
</script>
</body>
</html>
