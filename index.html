<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B59C3">
<meta name="description" content="Lebe ein ganzes Leben in einer zufälligen Stadt: Schule, Job, Liebe, Börse und Social Media.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lebenslauf">
<title>Lebenslauf – Lebenssimulator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap">
<style>
/* VOICE: freundlich, verspielt, klar – ein Handyspiel
   IDEA: ein Lebenslauf in einer Spielzeugstadt, die bei jedem Leben neu entsteht
   PICTURE: die 3D-Stadt selbst, darunter der gewählte Ort mit seinen Aktionen
   COLOUR and TYPE: Blau führt, Orange für die Hauptaktion, Pastell-Gebäude; Nunito
   LAYOUT: Handyspalte: Kopf, Stadt/Inhalt, großer Knopf, Tab-Leiste */
:root{color-scheme:light dark;
--bg:light-dark(#EEF2F9,#10152A);--card:light-dark(#FFFFFF,#1B2340);--ink:light-dark(#1B1F2A,#EEF1F8);
--muted:light-dark(#4A5263,#AEB6CA);--line:light-dark(#DCE3F0,#2E3858);--blue:#2B59C3;--blueText:light-dark(#2B59C3,#8FAEF5);
--soft:light-dark(#E3EAFA,#24305A);--orange:#F28C28;--good:light-dark(#1E7A3C,#7FD69B);--bad:light-dark(#B42318,#FF8A80)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 'Nunito',system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
#app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.top{background:var(--blue);color:#fff;padding:16px;display:flex;gap:12px;align-items:center}
.ava{width:50px;height:50px;border-radius:25px;background:#fff;color:#2B59C3;display:grid;place-items:center;font-weight:900;font-size:18px;flex:none}
.top .n{font-weight:900;font-size:19px;line-height:1.2}.top .s{font-size:14px;font-weight:600}
.top .m{margin-left:auto;text-align:right;flex:none}.top .m small{display:block;font-size:12px;font-weight:700}.top .m b{font-size:17px;font-weight:900;white-space:nowrap}
main{flex:1;padding:14px 14px 8px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:18px;padding:14px 16px}
.h{font-weight:900;font-size:17px;margin:0 0 6px}
.lbl{font-size:13px;font-weight:800;color:var(--muted)}
.stat{margin:0 0 10px}.stat:last-child{margin:0}
.stat .r{display:flex;justify-content:space-between;font-size:14px;font-weight:800}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:5px;transition:width .4s}
.bar i.low{background:var(--orange)}
.log div{display:flex;gap:10px;font-size:15px;padding:4px 0}
.log span:first-child{font-weight:900;color:var(--blueText);min-width:62px;flex:none}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .t{flex:1}.row .t b{display:block;font-size:15px}.row .t small{color:var(--muted);font-weight:600;font-size:13px}
.num{font-weight:900;white-space:nowrap;text-align:right}
.up{color:var(--good)}.down{color:var(--bad)}
.btn{min-height:44px;border:0;border-radius:14px;padding:0 16px;font-weight:800;font-size:15px;background:var(--blue);color:#fff}
.btn.o{background:var(--orange);color:#1B1F2A}.btn.g{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:19px;flex:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.big{width:100%;height:58px;border-radius:29px;font-size:20px;font-weight:900}
.age{padding:4px 14px 10px}
.chip{display:inline-block;background:var(--soft);color:var(--blueText);font-weight:800;font-size:13px;border-radius:12px;padding:3px 10px;white-space:nowrap}
nav.tabs{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 4px 12px;z-index:3}
nav.tabs button{background:none;border:0;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted)}
nav.tabs button[aria-current=true]{color:var(--blueText);font-weight:900}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#city{position:relative;height:56vh;min-height:340px;max-height:620px;background:#BFD9F2;display:none;overflow:hidden}
#cv{position:absolute;inset:0}#cv canvas{display:block;width:100%;height:100%}
.ctl{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.ctl>*{pointer-events:auto}
.cname{background:rgba(255,255,255,.92);color:#1B1F2A;border-radius:14px;padding:6px 12px;font-weight:900;font-size:15px;line-height:1.2}
.cname small{display:block;font-weight:700;font-size:12px;color:#4A5263}
.seg{display:flex;background:rgba(255,255,255,.92);border-radius:14px;padding:3px;gap:2px}
.seg button{border:0;background:none;min-height:38px;min-width:44px;border-radius:11px;font-weight:800;font-size:14px;color:#1B1F2A}
.seg button[aria-pressed=true]{background:#2B59C3;color:#fff}
.rot{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.rot button{width:44px;height:44px;border-radius:22px;border:0;background:rgba(255,255,255,.92);color:#1B1F2A;display:grid;place-items:center}
.listseg{display:flex;gap:8px;align-items:center;justify-content:space-between}
.start{padding:34px 18px 24px;display:flex;flex-direction:column;gap:16px;min-height:100dvh}
.start h1{margin:0;font-size:38px;line-height:1.05;color:var(--blueText);font-weight:900}
.start p{margin:4px 0 0;color:var(--muted);font-weight:600}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:800}
input[type=text]{height:48px;border:2px solid var(--line);border-radius:12px;padding:0 14px;font:700 16px 'Nunito',sans-serif;background:var(--card);color:var(--ink)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px;text-align:left;min-height:44px}
.opt b{display:block;font-size:16px}.opt small{color:var(--muted);font-weight:600}
.opt[aria-pressed=true]{border:3px solid var(--blue);background:var(--soft);padding:11px}
.grid3 .opt{text-align:center;font-weight:800}
.plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pl{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--card);border-radius:14px;min-height:48px;padding:6px 10px;text-align:left;font-weight:800;font-size:14px}
.pl i{width:14px;height:14px;border-radius:7px;flex:none}
.pl[aria-pressed=true]{border-color:var(--orange)}
.ach{display:flex;flex-wrap:wrap;gap:6px}
.ach span{font-size:13px;font-weight:800;border-radius:12px;padding:4px 10px;background:var(--line);color:var(--muted)}
.ach span.on{background:var(--orange);color:#1B1F2A}
#modal{position:fixed;inset:0;background:rgba(16,21,42,.6);display:none;align-items:center;justify-content:center;padding:18px;z-index:9}
#modal.on{display:flex}
.dlg{background:var(--card);border-radius:24px;padding:22px 18px 18px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px;animation:pop .25s ease-out}
.dlg h2{margin:0;font-size:22px;font-weight:900;line-height:1.15}.dlg p{margin:0;font-weight:600;font-size:17px}
.dlg .ch{display:flex;flex-direction:column;gap:8px}.dlg .ch .btn{text-align:left;min-height:52px;padding:10px 16px}.dlg .ch .btn:only-child{text-align:center}
.dlg .ch .btn:not(:first-child){background:transparent;border:2px solid var(--line);color:var(--ink)}
@keyframes pop{from{transform:scale(.94);opacity:0}}
@media(prefers-reduced-motion:reduce){.dlg{animation:none}.bar i{transition:none}}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:800;padding:10px 16px;border-radius:14px;max-width:90vw;display:none;z-index:8;text-align:center}
.phone{background:light-dark(#1B2340,#0B1022);color:#EEF1F8;border-radius:30px;padding:16px 14px 18px;border:6px solid light-dark(#2A3458,#2A3458);display:flex;flex-direction:column;gap:14px}
.pstat{display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:#AEB6CA;padding:0 4px}
.rings{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ring{--v:50;aspect-ratio:1;max-width:76px;justify-self:center;width:100%;border-radius:50%;background:conic-gradient(#F28C28 calc(var(--v)*1%),#2E3858 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:light-dark(#1B2340,#0B1022)}
.ring b{position:relative;font-size:18px;font-weight:900}
.rw{display:flex;flex-direction:column;align-items:center;gap:4px}.rw small{font-size:12px;font-weight:800;color:#C5CCDD}
.ring{max-width:64px}
.news{text-align:left;border:0;background:#24305A;color:#EEF1F8;border-radius:16px;padding:10px 14px;font-weight:700;font-size:15px;min-height:44px}
.news small{display:block;font-size:12px;color:#AEB6CA;font-weight:800}
.pnote{margin:0;background:#4A2330;color:#FFD9DE;border-radius:14px;padding:8px 12px;font-weight:700;font-size:14px}
.apps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 6px}
.app{background:none;border:0;color:#EEF1F8;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:800;padding:0;min-height:44px}
.app .ic{width:58px;height:58px;border-radius:17px;display:grid;place-items:center;color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.app .ic svg{width:28px;height:28px}
.app:disabled{opacity:.35}
.appbar{display:flex;align-items:center;gap:10px}
.appbar h2{margin:0;font-size:22px;font-weight:900}
.appbar .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;flex:none}
.appbar .ic svg{width:20px;height:20px}
.back{width:44px;height:44px;border-radius:22px;border:0;background:var(--card);display:grid;place-items:center;flex:none}
svg.up{color:var(--good)}svg.down{color:var(--bad)}
.bigv{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin:4px 0 8px}.bigv b{font-size:28px;font-weight:900;line-height:1.1;white-space:nowrap}.bigv span{font-weight:800;font-size:15px;white-space:nowrap}
.rs{background:var(--soft);display:inline-flex;margin-bottom:8px}.rs button{color:var(--ink)}
.bc{position:relative;padding:18px 0}.yl{position:absolute;right:0;font-size:12px;font-weight:800;color:var(--muted)}.yl.t{top:0}.yl.b{bottom:0}
.xl{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;margin-top:12px}.kv small{display:block;font-size:12px;font-weight:800;color:var(--muted)}.kv b{font-size:15px;white-space:nowrap}
.srow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:10px 0;text-align:left;min-height:56px}
.srow:first-of-type{border-top:0}.sn b{display:block;font-size:15px}.sn small,.sv small{font-size:13px;font-weight:700;color:var(--muted)}.sv{text-align:right}.sv b{display:block;font-size:15px;white-space:nowrap}.sv small.up{color:var(--good)}.sv small.down{color:var(--bad)}
.alloc{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin:6px 0}.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;font-weight:700;color:var(--muted)}.leg i{display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:5px}
#view2{flex:1;padding:14px 14px 8px;display:flex;flex-direction:column;gap:12px}

/* --- Runder, lebendiger --- */
body{background:light-dark(linear-gradient(180deg,#EAF0FB,#F5F2FA),#10152A);background-attachment:fixed}
.top{background:linear-gradient(135deg,#2B59C3,#5B7CE6);border-radius:0 0 28px 28px;padding:14px 16px 18px;box-shadow:0 8px 24px rgba(43,89,195,.25)}
.ava{width:62px;height:62px;border-radius:31px;background:#fff;padding:2px;position:relative;overflow:visible}
.ava svg{border-radius:50%}
.agebadge{position:absolute;right:-4px;bottom:-4px;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:#F28C28;color:#1B1F2A;font-weight:900;font-size:14px;display:grid;place-items:center;border:2px solid #fff}
.top .m{background:rgba(255,255,255,.16);border-radius:18px;padding:6px 12px}
.card{border-radius:24px;box-shadow:0 1px 0 rgba(30,40,80,.04),0 8px 24px rgba(30,40,80,.06)}
.btn{border-radius:999px;transition:transform .12s}
.btn:active:not(:disabled){transform:scale(.96)}
.big{background:linear-gradient(135deg,#FFA24C,#F27A28);box-shadow:0 8px 20px rgba(242,140,40,.35)}
.btn.big:not(.o){background:linear-gradient(135deg,#2B59C3,#5B7CE6);box-shadow:0 8px 20px rgba(43,89,195,.3)}
.age{position:sticky;bottom:0;padding:10px 14px 14px;background:linear-gradient(180deg,transparent,var(--bg) 40%);z-index:4}
.phone{border-radius:36px;box-shadow:0 18px 40px rgba(16,21,42,.25)}
.app .ic{position:relative;border-radius:20px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15),0 6px 14px rgba(0,0,0,.25)}
.app:active:not(:disabled) .ic{transform:scale(.92)}
.badge{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#FF3B5C;color:#fff;font-size:12px;font-weight:900;display:grid;place-items:center;border:2px solid light-dark(#1B2340,#0B1022)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
#view>*,#view2>*{animation:rise .32s ease-out both}
#view>*:nth-child(2),#view2>*:nth-child(2){animation-delay:.04s}#view>*:nth-child(3),#view2>*:nth-child(3){animation-delay:.08s}#view>*:nth-child(4){animation-delay:.12s}
.me{display:flex;align-items:center;gap:16px}.me b{display:block;font-size:20px;font-weight:900}.me small{display:block;color:var(--muted);font-weight:700}
.meav svg,.rav svg,.kl-av svg{border-radius:50%}
/* Rückblick */
.dlg.recap{position:relative;overflow:hidden auto;max-height:88vh}
.conf{position:absolute;inset:0 0 auto;height:0}
.conf i{position:absolute;top:-12px;width:8px;height:14px;border-radius:3px;animation:fall 1.6s ease-in forwards;opacity:.9}
@keyframes fall{to{transform:translateY(260px) rotate(320deg);opacity:0}}
.rhead{display:flex;align-items:center;gap:16px}.rhead small{display:block;font-weight:800;color:var(--muted)}
.rage{display:block;font-size:56px;line-height:1;font-weight:900;color:var(--blueText);animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.rav.new{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.look{margin:0;background:var(--soft);color:var(--blueText);border-radius:14px;padding:8px 12px;font-weight:900;text-align:center}
.dchips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.dchip{border-radius:14px;padding:7px 10px;background:var(--line);font-weight:700;font-size:14px;display:flex;justify-content:space-between}
.dchip.pos{background:light-dark(#DDF5E6,#1C3B2A)}.dchip.pos b{color:var(--good)}.dchip.neg{background:light-dark(#FDE3E1,#4A2330)}.dchip.neg b{color:var(--bad)}
.mbox{background:light-dark(#F4F6FB,#141A33);border-radius:18px;padding:10px 14px}
.mt{font-size:13px;font-weight:900;color:var(--muted);margin:8px 0 2px;text-transform:none}
.mrow{display:flex;justify-content:space-between;gap:10px;font-size:15px;padding:3px 0;font-weight:600}.mrow b{white-space:nowrap}
.mrow.tot{border-top:2px solid var(--line);margin-top:6px;padding-top:8px;font-weight:900}
.evl{margin:0;padding-left:18px;font-weight:600;font-size:15px}.evl li{margin:3px 0}
/* Chats */
.clist{padding:6px 10px}
.crow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:10px 4px;text-align:left;min-height:60px}
.crow:first-child{border-top:0}
.cav{width:44px;height:44px;border-radius:22px;color:#fff;font-weight:900;font-size:18px;display:grid;place-items:center;flex:none}
.ct{flex:1;min-width:0}.ct b{display:block;font-size:16px}.ct small{display:block;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .badge{position:static;border-color:var(--card)}
.chat{background:var(--card);border-radius:24px;overflow:hidden;box-shadow:0 8px 24px rgba(30,40,80,.06)}
.chat header{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.chat header b{display:block}.chat header small{color:var(--muted);font-weight:700}
.chat .back{background:var(--bg)}
.bubbles{display:flex;flex-direction:column;gap:8px;padding:14px 12px;background:light-dark(#F1F4FA,#141A33);min-height:260px;max-height:52vh;overflow-y:auto}
.bub{max-width:80%;align-self:flex-start;background:var(--card);border-radius:18px 18px 18px 6px;padding:8px 12px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.bub.me{align-self:flex-end;background:#2B59C3;color:#fff;border-radius:18px 18px 6px 18px}
.bub small{display:block;font-size:11px;opacity:.7;font-weight:700;margin-top:2px}
.qa{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px}
/* Klick */
.kl-hero{border-radius:28px;padding:28px 20px;color:#fff;background:linear-gradient(135deg,#FF9A4C,#E5407A 55%,#8E63D6);display:flex;flex-direction:column;gap:12px;box-shadow:0 14px 30px rgba(229,64,122,.3)}
.kl-logo{font-size:44px;font-weight:900;letter-spacing:-.02em;line-height:1}
.kl-hero p{margin:0;font-weight:700;font-size:17px}
.kl-steps{display:flex;flex-wrap:wrap;gap:6px}.kl-steps span{background:rgba(255,255,255,.22);border-radius:12px;padding:4px 10px;font-weight:800;font-size:14px}
.kl-btn{background:#fff!important;color:#C2306A!important;box-shadow:none!important}
.kl-note{background:rgba(0,0,0,.18);border-radius:14px;padding:8px 12px}
.kl-prof{border-radius:28px;padding:18px 16px;color:#fff;background:linear-gradient(135deg,#FF9A4C,#E5407A 55%,#8E63D6);box-shadow:0 14px 30px rgba(229,64,122,.3);display:flex;flex-direction:column;gap:10px}
.kl-top{display:flex;align-items:center;gap:14px}.kl-av{border:3px solid #fff;border-radius:50%;flex:none}
.kl-top b{display:block;font-size:19px;font-weight:900}.kl-top small{display:block;font-weight:700;opacity:.9}
.kl-lv{display:inline-block;margin-top:4px;background:#fff;color:#C2306A;border-radius:10px;padding:2px 10px;font-weight:900;font-size:13px}
.kl-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));text-align:center;background:rgba(255,255,255,.16);border-radius:18px;padding:10px 4px}
.kl-stats b{display:block;font-size:20px;font-weight:900}.kl-stats small{font-weight:700;opacity:.9}
.kl-prog{height:10px;border-radius:5px;background:rgba(255,255,255,.3);overflow:hidden}.kl-prog i{display:block;height:100%;background:#fff;border-radius:5px}
.kl-next{font-weight:700;opacity:.95}
.kl-trust{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}.kbar{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.3);overflow:hidden}.kbar i{display:block;height:100%;background:#FFE08A}
.trend{display:flex;flex-direction:column;gap:2px;border-radius:20px;padding:12px 16px;background:light-dark(#FFF1E4,#3A2A1C);border:2px dashed #F28C28;text-align:left;width:100%;font:inherit;color:inherit}
.trend b{font-size:16px}.trend span{font-weight:600;color:var(--muted);font-size:14px}
.trend.pro{border:0;background:linear-gradient(135deg,light-dark(#EDE6FF,#2A2550),light-dark(#FFE6EF,#3A1F33))}
button.trend{cursor:pointer}
.kl-tabs{background:var(--card);box-shadow:0 4px 14px rgba(30,40,80,.06);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-radius:18px;padding:4px}
.kl-tabs button{color:var(--ink);border-radius:14px;min-height:42px}.kl-tabs button[aria-pressed=true]{background:linear-gradient(135deg,#FF9A4C,#E5407A);color:#fff}
.ptypes{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.ptype{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:76px;border-radius:18px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:14px;color:var(--ink)}
.ptype small{font-size:12px;color:var(--muted);font-weight:700}
.ptype.hot{border-color:#F28C28;background:light-dark(#FFF1E4,#3A2A1C)}
.ptype:disabled{opacity:.45}
.ptype .dot{width:22px;height:22px;border-radius:7px}
.post{background:var(--card);border-radius:24px;overflow:hidden;box-shadow:0 8px 24px rgba(30,40,80,.08)}
.post header{display:flex;align-items:center;gap:10px;padding:10px 12px}.post header b{display:block;font-size:15px}.post header small{color:var(--muted);font-weight:700}
.pav svg{border-radius:50%}
.art{display:block;width:100%;height:240px}
.art.meme{display:grid;place-items:center;background:#1B1F2A;color:#fff;padding:20px;text-align:center}.art.meme span{font-size:26px;font-weight:900;line-height:1.15;text-transform:uppercase}
.pbody{padding:10px 14px 14px}.pbody p{margin:4px 0 0;font-size:15px}.pbody .com{color:var(--muted);font-weight:600}
.likes{display:flex;align-items:center;gap:6px;font-weight:700}
.dlgpost{box-shadow:none;border:2px solid var(--line)}.dlgpost .art{height:200px}
.gain{display:flex;gap:8px}.gain span{flex:1;background:var(--soft);border-radius:16px;padding:8px;text-align:center;font-weight:700;font-size:13px;color:var(--muted)}.gain b{display:block;font-size:20px;color:var(--ink)}
.vrow{display:grid;grid-template-columns:112px minmax(0,1fr);gap:12px;align-items:center;padding:8px 0}
.vrow b{display:block;font-size:15px;line-height:1.25}.vrow small{color:var(--muted);font-weight:600;font-size:13px}
.thumb{height:63px;border-radius:14px;display:grid;place-items:center;position:relative;color:#fff}
.thumb span{position:absolute;left:8px;bottom:5px;font-size:11px;font-weight:900}
.live{position:relative}.onair{display:inline-block;background:#FF3B5C;color:#fff;font-weight:900;font-size:12px;border-radius:8px;padding:2px 8px;margin-bottom:6px;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.4}}
.deal{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.deal:first-of-type{border-top:0}.dt b{display:block}.dt small{color:var(--muted);font-weight:600}
@media(prefers-reduced-motion:reduce){#view>*,#view2>*,.rage,.rav.new,.conf i,.onair{animation:none}.conf{display:none}}
.top{padding-top:max(14px,env(safe-area-inset-top))}
.age{padding-bottom:max(14px,env(safe-area-inset-bottom))}
.start{padding-top:max(34px,env(safe-area-inset-top))}
.note{font-size:13px;color:var(--muted);font-weight:600;margin:0}

    '<div style="flex:1"></div><button class="btn o big" id="go">Leben starten</button><button class="btn g" id="rnd">Zufälliges Leben</button><p class="note" style="text-align:center">Prototyp · Spielstand wird nur in diesem Browser gespeichert</p></div>';
  const keep=()=>{form.fn=document.getElementById('fn').value;form.ln=document.getElementById('ln').value};
  app.querySelectorAll('[data-gs]').forEach(b=>b.onclick=()=>{form.g=b.dataset.gs;app.querySelectorAll('[data-gs]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  app.querySelectorAll('[data-as]').forEach(b=>b.onclick=()=>{form.a=+b.dataset.as;app.querySelectorAll('[data-as]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  document.getElementById('sb').onclick=e=>{form.sb=!form.sb;e.currentTarget.setAttribute('aria-pressed',form.sb)};
  document.getElementById('go').onclick=()=>{keep();newLife((form.fn||'').trim()||'Lena',(form.ln||'').trim()||'Krüger',form.g,form.a,form.sb)};
  document.getElementById('rnd').onclick=()=>{const g=pick(['w','m']);newLife(pick(g==='m'?MN:FN),pick(LN),g,pick([0,6,13,18]),form.sb)};
  const c=document.getElementById('cont');if(c)c.onclick=()=>{p=old;tab='home';sel='home';render()};
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-t]');if(t&&t.closest('#nav')){tab=t.dataset.t;render();window.scrollTo(0,0);return}
  const a=e.target.closest('[data-a]');if(a&&!a.disabled&&a.closest('#app'))act(a.dataset.a,a.dataset.g);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const m=document.getElementById('modal');if(m.classList.contains('on')&&m.querySelectorAll('[data-o]').length===1)m.querySelector('[data-o]').click()}});
render();
}
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update()});
    }).catch(()=>{});
  });
}
</script>
</body>
</html>
